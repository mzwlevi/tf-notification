name: TestFlight Watcher

on:
  schedule:
    # 每 5 分钟运行一次（UTC 时间）
    - cron: '*/5 * * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # 防止脚本卡住
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Restore state from cache
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: tf_state.json
          key: tf-state-cache
          restore-keys: |
            tf-state-cache

      - name: Run checker
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          # 如果用自己的 Bark 服务器，取消注释并填入
          # BARK_SERVER: ${{ secrets.BARK_SERVER }}
        run: python check.py

      - name: Save state to cache
        if: always()  # 即使检查失败也保存状态
        uses: actions/cache@v4
        with:
          path: tf_state.json
          key: tf-state-cache
          restore-keys: |
            tf-state-cache
