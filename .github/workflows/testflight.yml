name: TestFlight Watcher

on:
  schedule:
    # 每 5 分钟运行一次（UTC 时间）
    - cron: '*/5 * * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # 防止脚本卡住
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download previous state
        uses: actions/download-artifact@v4
        with:
          name: tf-state
          path: .
        continue-on-error: true  # 首次运行没有 artifact，允许失败

      - name: Run checker
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          # 如果用自己的 Bark 服务器，取消注释并填入
          # BARK_SERVER: ${{ secrets.BARK_SERVER }}
        run: python check.py

      - name: Upload state
        if: always()  # 即使检查失败也保存状态
        uses: actions/upload-artifact@v4
        with:
          name: tf-state
          path: tf_state.json
          retention-days: 1  # 只保留1天，节省空间
