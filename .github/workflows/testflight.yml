name: Check TestFlight Status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-tf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 使用 Cache 在多次运行间持久化 tf_state.json
      - name: Restore or Save tf_state.json Cache
        uses: actions/cache@v4
        with:
          path: tf_state.json
          key: tf-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tf-state-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run check.py
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python check.py
