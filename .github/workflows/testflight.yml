name: Check TestFlight Status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-tf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 1. 尝试下载上一次运行留下的 tf_state.json
      - name: Restore tf_state.json from previous run
        uses: actions/download-artifact@v4
        with:
          name: tf-state
        continue-on-error: true # 第一次运行时没有产物，忽略错误继续执行

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run check.py
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python check.py

      # 2. 将最新的 tf_state.json 保存为 Artifact，供下一次运行使用
      - name: Upload tf_state.json as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf-state
          path: tf_state.json
          overwrite: true
