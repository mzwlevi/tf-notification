name: Check TestFlight Status

on:
  schedule:
    # 每 5 分钟运行一次（GitHub 在高峰期可能存在数分钟延迟）
    - cron: '*/5 * * * *'
  workflow_dispatch: # 支持手动触发测试

jobs:
  check-tf:
    runs-on: ubuntu-latest

    # 赋予 GITHUB_TOKEN 写权限，用于将 tf_state.json 提交回仓库
    permissions:
      contents: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run check.py
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          # 如果你有自定义的 BARK_SERVER，也可以顺便配置，没有就不用管
          # BARK_SERVER: ${{ secrets.BARK_SERVER }}
        run: python check.py

      # 自动把更新后的 tf_state.json 提交回仓库，解决重复推送问题
      - name: Commit and push tf_state.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add tf_state.json
          git commit -m "update TestFlight state [skip ci]" || exit 0
          git push
