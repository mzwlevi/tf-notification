name: Auto Run Check Script

on:
  schedule:
    # 每 5 分钟触发一次（注意：GitHub Actions 高峰期可能会有几分钟延迟）
    - cron: '*/5 * * * *'
  workflow_dispatch: # 支持在 GitHub 页面手动点击触发测试

jobs:
  run-check:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. 配置 Python 环境（可以根据需要修改 Python 版本）
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖（如果 check.py 用到了第三方库，取消下面两行的注释并确保仓库内有 requirements.txt）
      # - name: Install dependencies
      #   run: pip install -r requirements.txt

      # 4. 执行你的 check.py 脚本
      - name: Run check.py
        run: python check.py
