name: TestFlight Watcher

on:
  schedule:
    # 每 10 分钟运行一次（UTC 时间）
    - cron: '*/10 * * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Restore previous state
        uses: actions/cache@v4
        with:
          path: tf_state.json
          key: tf-state-${{ github.run_id }}
          restore-keys: |
            tf-state-

      - name: Run checker
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          # 如果用自己的 Bark 服务器，取消下面注释并填入
          # BARK_SERVER: ${{ secrets.BARK_SERVER }}
        run: python check.py

      - name: Save state
        uses: actions/cache@v4
        with:
          path: tf_state.json
          key: tf-state-${{ github.run_id }}
